name: Update team radio transcripts
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      session:
        description: 'Optional OpenF1 session key; blank checks the season'
        required: false
        type: string
      year:
        description: 'Optional season year; blank uses current UTC year'
        required: false
        type: string
      retry_failed:
        description: 'Retry failed clips immediately; completed clips stay unchanged'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: radio-transcripts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RADIO_AUDIO_PROXY: https://pitwall-f1-nine.vercel.app/api/radio/audio
      INPUT_RETRY_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Open persistent data branch
        id: data
        run: |
          git fetch origin codex/radio-transcripts --depth=1
          git worktree add --detach "$RUNNER_TEMP/radio-data" FETCH_HEAD
          cp vercel.json "$RUNNER_TEMP/radio-data/vercel.json"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Discover finished sessions and new audio
        id: discover
        env:
          INPUT_SESSION: ${{ inputs.session }}
          INPUT_YEAR: ${{ inputs.year }}
        run: |
          args=(--data-dir "$RUNNER_TEMP/radio-data" --discover-only)
          if [ -n "$INPUT_SESSION" ]; then args+=(--session "$INPUT_SESSION"); fi
          if [ -n "$INPUT_YEAR" ]; then args+=(--year "$INPUT_YEAR"); fi
          if [ "$INPUT_RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          python scripts/cloud-radio-transcripts.py "${args[@]}"
      - name: Restore speech model
        if: steps.discover.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: radio-whisper-small-en-v1
      - name: Install speech engine only when audio is pending
        if: steps.discover.outputs.has_work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r scripts/cloud-radio-requirements.txt
      - name: Transcribe up to 80 clips
        if: steps.discover.outputs.has_work == 'true'
        run: |
          args=(--data-dir "$RUNNER_TEMP/radio-data" --from-queue --limit 80)
          if [ "$INPUT_RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          python scripts/cloud-radio-transcripts.py "${args[@]}"
      - name: Discover captions missing Chinese
        id: translations
        if: always() && steps.data.outputs.ready == 'true'
        env:
          INPUT_SESSION: ${{ inputs.session }}
        run: |
          args=(--data-dir "$RUNNER_TEMP/radio-data" --discover-only)
          if [ -n "$INPUT_SESSION" ]; then args+=(--session "$INPUT_SESSION"); fi
          if [ "$INPUT_RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          python scripts/cloud-radio-translate.py "${args[@]}"
      - name: Translate new and existing captions
        if: always() && steps.translations.outputs.has_work == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          INPUT_SESSION: ${{ inputs.session }}
        run: |
          args=(--data-dir "$RUNNER_TEMP/radio-data" --limit 80)
          if [ -n "$INPUT_SESSION" ]; then args+=(--session "$INPUT_SESSION"); fi
          if [ "$INPUT_RETRY_FAILED" = "true" ]; then args+=(--retry-failed); fi
          python scripts/cloud-radio-translate.py "${args[@]}"
      - name: Persist successful clips and retry state
        if: always() && steps.data.outputs.ready == 'true'
        run: |
          cd "$RUNNER_TEMP/radio-data"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all .
          if ! git diff --cached --quiet; then
            git commit -m 'Update team radio subtitles'
            git push origin HEAD:codex/radio-transcripts
          fi
