name: Refresh sourced pre-race stories
on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editorial-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/cloud-editorial-requirements.txt
      - name: Open independent persistent news branch
        id: data
        run: |
          git fetch origin codex/editorial-news --depth=1
          git worktree add --detach "$RUNNER_TEMP/editorial-data" FETCH_HEAD
          cp vercel.json "$RUNNER_TEMP/editorial-data/vercel.json"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install source parser and image compressor
        timeout-minutes: 5
        run: python -m pip install --timeout 30 --retries 2 -r scripts/cloud-editorial-requirements.txt
      - name: Check current official stories and public social references
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/cloud-editorial.py --data-dir "$RUNNER_TEMP/editorial-data" --limit 12
      - name: Persist news, compressed photos and livery records
        if: always() && steps.data.outputs.ready == 'true'
        run: |
          cd "$RUNNER_TEMP/editorial-data"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all .
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public F1 equipment and paddock stories'
            git push origin HEAD:codex/editorial-news
          fi
